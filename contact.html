<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veloura Studio | Contact</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: linear-gradient(180deg, #f7f3ee 0%, #eef3f8 100%); color: #2a2f36; }
        header { background: linear-gradient(135deg, #14263d 0%, #1f3b5b 100%); color: white; padding: 22px 20px; }
        .brand { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 18px; }
        .brand-mark { width: 52px; height: 52px; border-radius: 14px; background: #d96f4b; display: grid; place-items: center; font-weight: bold; font-size: 1.8rem; }
        h1 { margin: 0; font-size: clamp(2rem, 3vw, 2.6rem); }
        .tagline { margin: 4px 0 0; letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.72rem; opacity: 0.8; }
        nav { background: #102235; text-align: center; padding: 10px 0; }
        nav a { color: white; padding: 12px 18px; text-decoration: none; display: inline-block; font-weight: 600; }
        nav a:hover, nav a.active { background: rgba(217, 111, 75, 0.2); border-radius: 8px; }
        .back-link { background: #d96f4b; border-radius: 8px; margin-left: 12px; }
        .container { max-width: 900px; margin: 40px auto; background: white; padding: 34px; border-radius: 18px; box-shadow: 0 18px 40px rgba(20, 38, 61, 0.08); }
        .highlight { color: #d96f4b; font-weight: bold; }
        .contact-form { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #2c3e50; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; font-family: inherit; }
        .form-group textarea { resize: vertical; }
        .submit-btn { background: #d96f4b; color: white; padding: 14px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: background 0.3s; }
        .submit-btn:hover { background: #c55e3d; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="brand-mark">V</div>
            <div>
                <h1>Veloura Studio</h1>
                <p class="tagline">Branding • Web • Creative Direction</p>
            </div>
        </div>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="../index.html" class="back-link">Back to Main</a>
    </nav>
    
    <div class="container">
        <h2>Contact <span class="highlight">Veloura</span></h2>
        <p>Tell us a little about your project and we’ll help you shape the next step with clarity and confidence.</p>
        
        <form id="myForm" class="contact-form" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="studentName">Full Name:</label>
                <input type="text" id="studentName" placeholder="Enter your full name" required>
            </div>
            
            <div class="form-group">
                <label for="regNumber">Registration Number:</label>
                <input type="text" id="regNumber" placeholder="Enter your Reg Number (e.g., 123456)" required>
            </div>
            
            <div class="form-group">
                <label for="commentBox">Comment / Message:</label>
                <textarea id="commentBox" rows="5" placeholder="Type your message or instructions here..." required></textarea>
            </div>
            
            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            var name = document.getElementById('studentName').value;
            var regNum = document.getElementById('regNumber').value;
            var comment = document.getElementById('commentBox').value;
            alert("Success!\n\nName: " + name + "\nReg No: " + regNum + "\n\nYour comment has been recorded.");
            document.getElementById('myForm').reset();
        }
    </script>
</body>
</html>
