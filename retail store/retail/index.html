<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website 2 - Retail Store POS</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e8f5e9; margin: 0; padding: 20px; color: #333; }
        header { background-color: #2e7d32; color: white; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; position: relative; }
        .back-btn { position: absolute; right: 20px; top: 20px; background: #d32f2f; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; font-size: 14px; }
        .back-btn:hover { background: #b71c1c; }
        .main-layout { display: flex; gap: 20px; max-width: 1200px; margin: auto; }
        .products-section { flex: 2; }
        .cart-section { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); height: fit-content; position: sticky; top: 20px; }
        
        h2 { color: #1b5e20; border-bottom: 2px solid #a5d6a7; padding-bottom: 10px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-5px); }
        .product-info { padding: 15px; text-align: center; }
        .product-info h3 { margin: 0 0 10px 0; font-size: 18px; }
        .price { color: #2e7d32; font-weight: bold; font-size: 20px; margin-bottom: 15px; display: block; }
        
        .add-btn { background-color: #2e7d32; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; border-radius: 4px; font-size: 16px; }
        .add-btn:hover { background-color: #1b5e20; }
        
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .cart-total { font-size: 24px; font-weight: bold; text-align: right; margin-top: 20px; color: #2e7d32; }
        .checkout-btn { background-color: #1565c0; color: white; border: none; padding: 15px; width: 100%; cursor: pointer; border-radius: 5px; font-size: 18px; margin-top: 20px; }
        .checkout-btn:hover { background-color: #0d47a1; }
    </style>
</head>
<body>

    <header>
        <h1>Retail Store POS System</h1>
        <a href="../../index.html" class="back-btn">Back to Main</a>
    </header>

    <div class="main-layout">
        <div class="products-section">
            <h2>Available Products</h2>
            <div class="product-grid">
                <div class="product-card">
                    <div class="product-info">
                        <h3>Wireless Headphones</h3>
                        <span class="price">$45.00</span>
                        <button class="add-btn" onclick="addToCart('Wireless Headphones', 45)">Add to Cart</button>
                    </div>
                </div>
                <div class="product-card">
                    <div class="product-info">
                        <h3>Smart Watch</h3>
                        <span class="price">$120.00</span>
                        <button class="add-btn" onclick="addToCart('Smart Watch', 120)">Add to Cart</button>
                    </div>
                </div>
                <div class="product-card">
                    <div class="product-info">
                        <h3>Bluetooth Speaker</h3>
                        <span class="price">$35.00</span>
                        <button class="add-btn" onclick="addToCart('Bluetooth Speaker', 35)">Add to Cart</button>
                    </div>
                </div>
                <div class="product-card">
                    <div class="product-info">
                        <h3>Mechanical Keyboard</h3>
                        <span class="price">$85.00</span>
                        <button class="add-btn" onclick="addToCart('Mechanical Keyboard', 85)">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="cart-section">
            <h2>Shopping Cart</h2>
            <div id="cart-items">
                <p style="color: #888; text-align: center;">Your cart is empty.</p>
            </div>
            <div class="cart-total" id="cart-total">Total: $0.00</div>
            <button class="checkout-btn" onclick="checkout()">Complete Sale</button>
        </div>
    </div>

    <script>
        let cart = [];
        let total = 0;

        function addToCart(name, price) {
            cart.push({name: name, price: price});
            total += price;
            updateCartDisplay();
        }

        function updateCartDisplay() {
            const cartItemsDiv = document.getElementById('cart-items');
            cartItemsDiv.innerHTML = ''; 
            
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p style="color: #888; text-align: center;">Your cart is empty.</p>';
            } else {
                cart.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'cart-item';
                    itemDiv.innerHTML = `<span>${item.name}</span> <span>$${item.price.toFixed(2)}</span>`;
                    cartItemsDiv.appendChild(itemDiv);
                });
            }
            document.getElementById('cart-total').innerText = 'Total: $' + total.toFixed(2);
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Your cart is empty! Add items before completing a sale.");
                return;
            }
            alert("Sale Recorded!\nTotal amount: $" + total.toFixed(2) + "\nThank you for shopping with us.");
            cart = [];
            total = 0;
            updateCartDisplay();
        }
    </script>
</body>
</html>
