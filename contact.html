<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Website 1 - Contact</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f4f9; color: #333; }
        header { background-color: #2c3e50; color: white; padding: 15px 0; text-align: center; }
        nav { background-color: #34495e; overflow: hidden; text-align: center; }
        nav a { color: white; padding: 14px 20px; text-decoration: none; display: inline-block; }
        nav a:hover { background-color: #2c3e50; }
        nav a.active { background-color: #3498db; }
        .back-link { float: right; background-color: #e74c3c; margin-right: 20px; padding: 10px 15px; border-radius: 4px; text-decoration: none; color: white; }
        .container { max-width: 800px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        
        /* --- NEW STYLES FOR THE FORM --- */
        .contact-form { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #2c3e50; }
        
        /* Input and Textarea styling */
        .form-group input, .form-group textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            box-sizing: border-box; /* Ensures padding doesn't break the width */
            font-size: 16px; 
            font-family: inherit; 
        }
        .form-group textarea { resize: vertical; } /* Allows user to drag the comment box up/down */
        
        /* Submit Button styling */
        .submit-btn { 
            background-color: #3498db; 
            color: white; 
            padding: 14px 20px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            width: 100%; 
            transition: background 0.3s; 
        }
        .submit-btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>
    <header><h1>Website 1 - My Portfolio</h1></header>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="../index.html" class="back-link">Back to Main</a>
    </nav>
    
    <div class="container">
        <h2>Contact Us</h2>
        <p>Reach out via email or fill out the form below for inquiries regarding these projects.</p>
        
        <!-- THE NEW FORM STARTS HERE -->
        <form id="myForm" class="contact-form" onsubmit="handleSubmit(event)">
            
            <div class="form-group">
                <label for="studentName">Full Name:</label>
                <input type="text" id="studentName" placeholder="Enter your full name" required>
            </div>
            
            <div class="form-group">
                <label for="regNumber">Registration Number:</label>
                <input type="text" id="regNumber" placeholder="Enter your Reg Number (e.g., 123456)" required>
            </div>
            
            <div class="form-group">
                <label for="commentBox">Comment / Message:</label>
                <textarea id="commentBox" rows="5" placeholder="Type your message or instructions here..." required></textarea>
            </div>
            
            <button type="submit" class="submit-btn">Submit</button>
            
        </form>
        <!-- THE NEW FORM ENDS HERE -->
        
    </div>

    <!-- JavaScript to make the Submit button work -->
    <script>
        function handleSubmit(event) {
            event.preventDefault(); // Stops the page from refreshing when you click submit
            
            // Get the data typed into the boxes
            var name = document.getElementById('studentName').value;
            var regNum = document.getElementById('regNumber').value;
            var comment = document.getElementById('commentBox').value;
            
            // Show a popup confirming it worked
            alert("Success!\n\nName: " + name + "\nReg No: " + regNum + "\n\nYour comment has been recorded.");
            
            // Clear the form after submitting
            document.getElementById('myForm').reset();
        }
    </script>
</body>
</html>
