<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veloura Studio | Retail Store</title>
    <style>
        :root {
            --navy: #14263d;
            --navy-soft: #1f3b5b;
            --terracotta: #d96f4b;
            --sand: #f5efe8;
            --text: #2a2f36;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(180deg, #f7f3ee 0%, #eef3f8 100%); margin: 0; padding: 24px; color: var(--text); }
        header { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-soft) 100%); color: white; padding: 22px 24px; border-radius: 16px; margin: 0 auto 28px; max-width: 1200px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .brand { display: flex; align-items: center; gap: 16px; }
        .brand-mark { width: 50px; height: 50px; flex: 0 0 50px; border-radius: 14px; background: var(--terracotta); display: grid; place-items: center; font-size: 1.8rem; font-weight: bold; }
        header h1 { margin: 0; font-size: clamp(1.5rem, 3vw, 2rem); }
        .tagline { margin: 5px 0 0; letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.68rem; opacity: 0.8; }
        .back-btn { background: var(--terracotta); color: white; padding: 10px 16px; text-decoration: none; border-radius: 999px; font-size: 14px; font-weight: 700; white-space: nowrap; }
        .back-btn:hover { background: #c55e3d; }
        .main-layout { display: flex; gap: 24px; max-width: 1200px; margin: auto; align-items: flex-start; }
        .products-section { flex: 2; }
        .cart-section { flex: 1; background: white; padding: 22px; border-radius: 18px; box-shadow: 0 12px 30px rgba(20,38,61,0.08); height: fit-content; position: sticky; top: 20px; }
        
        h2 { color: var(--navy); border-bottom: 2px solid #e5d7cb; padding-bottom: 12px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 24px rgba(20,38,61,0.07); transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:hover { box-shadow: 0 14px 30px rgba(20,38,61,0.12); }
        .product-card:hover { transform: translateY(-5px); }
        .product-info { padding: 15px; text-align: center; }
        .product-info h3 { margin: 0 0 10px 0; font-size: 18px; }
        .price { color: var(--terracotta); font-weight: bold; font-size: 20px; margin-bottom: 15px; display: block; }
        
        .add-btn { background-color: var(--navy); color: white; border: none; padding: 11px; width: 100%; cursor: pointer; border-radius: 8px; font-size: 16px; font-weight: 700; }
        .add-btn:hover { background-color: var(--navy-soft); }
        
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .cart-total { font-size: 24px; font-weight: bold; text-align: right; margin-top: 20px; color: var(--navy); }
        .checkout-btn { background-color: var(--terracotta); color: white; border: none; padding: 15px; width: 100%; cursor: pointer; border-radius: 8px; font-size: 18px; font-weight: 700; margin-top: 20px; }
        .checkout-btn:hover { background-color: #c55e3d; }
        @media (max-width: 760px) {
            body { padding: 14px; }
            header { align-items: flex-start; flex-direction: column; }
            .main-layout { flex-direction: column; }
            .products-section, .cart-section { width: 100%; }
            .cart-section { position: static; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">V</div>
            <div>
                <h1>Veloura Studio</h1>
                <p class="tagline">Curated Goods • Retail</p>
            </div>
        </div>
        <a href="../../index.html" class="back-btn">Back to Main</a>
    </header>

    <div class="main-layout">
        <div class="products-section">
            <h2>Featured Products</h2>
            <div class="product-grid">
                <div class="product-card">
                    <div class="product-info">
                        <h3>Wireless Headphones</h3>
                        <span class="price">$45.00</span>
                        <button class="add-btn" onclick="addToCart('Wireless Headphones', 45)">Add to Cart</button>
                    </div>
                </div>
                <div class="product-card">
                    <div class="product-info">
                        <h3>Smart Watch</h3>
                        <span class="price">$120.00</span>
                        <button class="add-btn" onclick="addToCart('Smart Watch', 120)">Add to Cart</button>
                    </div>
                </div>
                <div class="product-card">
                    <div class="product-info">
                        <h3>Bluetooth Speaker</h3>
                        <span class="price">$35.00</span>
                        <button class="add-btn" onclick="addToCart('Bluetooth Speaker', 35)">Add to Cart</button>
                    </div>
                </div>
                <div class="product-card">
                    <div class="product-info">
                        <h3>Mechanical Keyboard</h3>
                        <span class="price">$85.00</span>
                        <button class="add-btn" onclick="addToCart('Mechanical Keyboard', 85)">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="cart-section">
            <h2>Shopping Cart</h2>
            <div id="cart-items">
                <p style="color: #888; text-align: center;">Your cart is empty.</p>
            </div>
            <div class="cart-total" id="cart-total">Total: $0.00</div>
            <button class="checkout-btn" onclick="checkout()">Complete Sale</button>
        </div>
    </div>

    <script>
        let cart = [];
        let total = 0;

        function addToCart(name, price) {
            cart.push({name: name, price: price});
            total += price;
            updateCartDisplay();
        }

        function updateCartDisplay() {
            const cartItemsDiv = document.getElementById('cart-items');
            cartItemsDiv.innerHTML = ''; 
            
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p style="color: #888; text-align: center;">Your cart is empty.</p>';
            } else {
                cart.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'cart-item';
                    itemDiv.innerHTML = `<span>${item.name}</span> <span>$${item.price.toFixed(2)}</span>`;
                    cartItemsDiv.appendChild(itemDiv);
                });
            }
            document.getElementById('cart-total').innerText = 'Total: $' + total.toFixed(2);
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Your cart is empty! Add items before completing a sale.");
                return;
            }
            alert("Sale Recorded!\nTotal amount: $" + total.toFixed(2) + "\nThank you for shopping with us.");
            cart = [];
            total = 0;
            updateCartDisplay();
        }
    </script>
</body>
</html>
